# Reference Nginx config (aaPanel: paste the relevant parts into
# Website → <site> → Config). Document root MUST be Laravel's public/.

# ---- Web app + API: https://your-domain ----
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain;
    root /www/wwwroot/pusoy13/public;
    index index.php;

    # ssl_certificate / ssl_certificate_key: managed by aaPanel (Let's Encrypt or Cloudflare Origin cert)

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-83.sock;   # aaPanel PHP 8.3 socket
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

# ---- Reverb websockets: wss://ws.your-domain ----
server {
    listen 443 ssl;
    http2 on;
    server_name ws.your-domain;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8080;
    }
}

server {
    listen 80;
    server_name your-domain ws.your-domain;
    return 301 https://$host$request_uri;
}
