; Laravel Reverb websocket server. Listens on 127.0.0.1:8080 only;
; Nginx terminates TLS and proxies wss:// traffic to it.
[program:pusoy-reverb]
command=/www/server/php/83/bin/php /www/wwwroot/pusoy13/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/www/wwwroot/pusoy13
user=www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/www/wwwroot/pusoy13/storage/logs/reverb.log
stdout_logfile_maxbytes=20MB
minfds=10000
