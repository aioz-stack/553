; Laravel queue workers (broadcasts, arrangement timers, settlement).
; Copy to /etc/supervisor/conf.d/ (or add via aaPanel "Supervisor Manager").
[program:pusoy-queue]
process_name=%(program_name)s_%(process_num)02d
command=/www/server/php/83/bin/php /www/wwwroot/pusoy13/artisan queue:work redis --sleep=1 --tries=3 --max-time=3600 --backoff=5
directory=/www/wwwroot/pusoy13
user=www
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/www/wwwroot/pusoy13/storage/logs/queue.log
stdout_logfile_maxbytes=20MB
